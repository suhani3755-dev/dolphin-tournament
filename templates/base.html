<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}Dolphin Badminton Academy{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="{{ url_for('home') }}">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="28" height="28">
            <circle cx="16" cy="16" r="15" fill="none" stroke="currentColor" stroke-width="1.4"/>
            <path d="M7 18c4-8 14-10 18-4-3 1-5 4-5 7 0 3 2 5 5 6-8 3-16-1-18-9z" fill="currentColor"/>
            <circle cx="22" cy="13" r="1.2" fill="#0b0b0c"/>
          </svg>
        </span>
        <span class="brand-text">
          <strong>Dolphin</strong>
          <em>Badminton Academy</em>
        </span>
      </a>
      {% block top_actions %}{% endblock %}
    </header>
    <main class="main">
      {% block content %}{% endblock %}
    </main>
  </div>
  <div id="toast" class="toast" hidden></div>
  {% block scripts %}{% endblock %}
</body>
</html>
