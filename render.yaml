services:
  - type: web
    name: dolphin-tournament
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: PYTHONUNBUFFERED
        value: "1"
      # Set this in the Render dashboard to a Neon Postgres URL.
      # Render's disk is ephemeral — SQLite will vanish on every deploy.
      - key: DATABASE_URL
        sync: false
